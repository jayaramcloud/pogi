  "Messaging & events": [sqs, sns, mq, kinesis, firehose, events, scheduler, pipes, kafka, managedkafka, pubsub, eventarc, eventgrid, eventhubs, servicebus, azqueue, signalr, azemail, ses, iot, iotdata]
  "Compute & containers": [lambda, lambda-microvms, ecs, eks, ec2, autoscaling, application-autoscaling, batch, elasticbeanstalk, lightsail, container, compute, run, cloudfunctions, azfunctions, azaks, azaci, azcontainerapps, azcompute]
  "Networking": [route53, route53resolver, elb, elbv2, globalaccelerator, network-firewall, aznetwork, servicediscovery, cloudfront]
  "Security & identity": [iam, sts, kms, cloudkms, keyvault, secretsmanager, secretmanager, acm, cognito-idp, cognito-identity, identitystore, sso, sso-admin, sso-oidc, verifiedpermissions, gcpiam, iamcredentials, gcpoauth, firebaseauth, entra, graph, guardduty, securityhub, detective, inspector2, macie2, accessanalyzer, wafv2, cloudhsmv2]
  "Observability": [logs, cloudwatch, cloudtrail, amp, rum, oam, logging, monitoring, azmonitor]
  "Integration & workflow": [stepfunctions, swf, apigateway, apim, appsync, appintegrations, connect, cloudtasks, cloudscheduler, mwaa]
  "Analytics & AI": [athena, glue, emr, emr-serverless, kinesisanalyticsv2, lakeformation, bigquery, sagemaker, sagemaker-runtime, bedrock, bedrock-agent, bedrock-agent-runtime, bedrock-agentcore, bedrock-agentcore-control, bedrock-runtime, comprehend, translate, textract, transcribe, rekognition]
  "Developer tools": [codebuild, codeartifact, codeguru-reviewer, codedeploy, codepipeline, ecr, artifactregistry, azacr, azappconfig]
  "Management & governance": [organizations, cloudformation, arm, resourcemanager, serviceusage, operations, cloudcontrol, resource-explorer-2, resourcegroupstaggingapi, config, controltower, controlcatalog, service-quotas, servicecatalog, ssm, appconfig, fis, ram, account, budgets, ce, cur, pricing, bcm-data-exports, bcm-pricing-calculator, meteringmarketplace, marketplace-catalog, marketplace-entitlement]

rows:
- title: "S3"
  cloud: aws
  depth: Deep
  services: [s3]
  covered: "buckets, objects, versioning, multipart, copy, tagging, ranges, conditional writes, presigned URLs and POST uploads, CORS, every Terraform `GetBucket*`, checksums (CRC32, CRC32C, CRC64NVME, SHA) and aws-chunked uploads, notifications to SQS, SNS, Lambda and EventBridge, bucket policies in enforcement (Allow and Deny, same and cross account, copy sources) and for anonymous callers, lifecycle rules applied by a sweep (current and noncurrent expiry, expired delete markers, aborted uploads, `x-amz-expiration`), Object Lock retention, legal hold and default retention enforced on delete and overwrite, static website hosting on `<bucket>.s3-website.localhost` (index and error documents)"
  not_yet: "stored replication settings are not acted on; lifecycle transitions are ignored; website routing rules are not applied; S3 Select; uploads over 10 MiB are refused unless `--max-upload-mb` is raised, because object bodies are held in memory (also in persistent mode)"

- title: "SQS"
  cloud: aws
  depth: Deep
  services: [sqs]
  covered: "standard and FIFO, JSON and Query protocols, visibility, long polling, delays, DLQs and redrive (incl. message move tasks), batches, tags, attribute MD5s"
  not_yet: ""

- title: "SNS"
  cloud: aws
  depth: Deep
  services: [sns]
  covered: "standard and FIFO topics; SQS, Lambda, HTTP, email and SMS (outbox) subscriptions; filter policies; raw delivery; platform applications"
  not_yet: ""

- title: "DynamoDB + Streams"
  cloud: aws
  depth: Deep
  services: [dynamodb]
  covered: "every expression type, GSI/LSI (GSI keys with up to four HASH and four RANGE attributes), Query/Scan with paging, transactions, batches, TTL, streams with Lambda triggers, exact numbers, on-demand backups and restore (also to a point in time, from the current items), global table replicas that copy writes between regions"
  not_yet: "PartiQL, import/export; redundant parentheses in an expression are accepted (AWS refuses some)"

- title: "Lambda"
  cloud: aws
  depth: Deep
  services: [lambda]
  covered: "CRUD, versions, aliases, layers, sync/async invoke, native Python/Node.js/custom runtimes or Docker, container images with ImageConfig, warm pool, reserved and provisioned concurrency with throttling, event source mappings (SQS, Kinesis, DynamoDB, and Amazon MSK clusters by ARN, and self-managed Kafka on any reachable broker) with batching windows, partial batch responses, bisecting and S3, SQS or SNS failure destinations, function URLs, hot reload, logs to CloudWatch, execution-role credentials, the Extensions API (INVOKE and SHUTDOWN events; extensions in a layer's `extensions/` folder start with native and Docker runtimes)"
  not_yet: "Java/.NET/Ruby run only in Docker, code signing, SnapStart; Kafka and MSK mappings use plain or SASL connections (no TLS settings), and an MSK mapping needs its cluster ACTIVE with Docker; extensions do not delay an invocation and the Logs and Telemetry APIs are not served, and a container image's own `/opt/extensions` do not start; `Architectures` is stored but native functions run on the host architecture; failed async invokes retry after 1 and 2 seconds, where AWS waits 1 and 2 minutes, so tests stay fast; `ListLayers` refuses a `CompatibleRuntime` of an unknown family but accepts a mistyped version such as `python3.99`"

- title: "API Gateway v1 + v2"
  cloud: aws
  depth: Deep
  services: [apigateway]
  covered: "REST and HTTP APIs, Lambda proxy (payload 1.0/2.0), HTTP proxy, mock, `AWS` integrations to Lambda and to other services (SQS, SNS, DynamoDB, Kinesis, Step Functions, S3 and more, with path and action URIs, request parameters and `selectionPattern` by status code), mapping templates in VTL (`#set`, `#if`, `#foreach`, `$input`, `$util`, `$context`, `$stageVariables`), custom domain names and base path mappings (REST, and HTTP with API mappings) reached by Host header or `*.localhost`, stage method settings (`~1` and `~0` paths), Lambda/JWT/Cognito authorizers, API keys and usage plans, CORS, OpenAPI import (API key security, warnings, `failonwarnings`)"
  not_yet: "WebSocket invoke, VTL `#macro`, the role of an `AWS` integration (`credentials`) is not assumed, custom domain certificates are not checked and domains answer over HTTP only; `AWS_IAM` routes need a SigV4-signed request but the signature and the caller's permissions are not checked; a RestApi resource policy is enforced for `Deny` statements only (no implicit deny)"

- title: "Step Functions"
  cloud: aws
  depth: Deep
  services: [stepfunctions]
  covered: "all state types, Retry/Catch, Map and Parallel, intrinsics, integrations with Lambda, SQS, SNS, DynamoDB, EventBridge and `aws-sdk:*`, callbacks, activities, `.sync` child executions, history, JSONata (`Arguments`, `Output`, `Assign`, `Condition`, `$states`, the built-in functions and the Step Functions ones, parsed at create) and state variables, JSONPath filters and `..`, state machine versions and aliases"
  not_yet: "distributed Map, redrive; Map `ToleratedFailure*` fields are checked at create but not applied (one failed item fails the Map); JSONata: `$eval`, `$formatInteger`, `$parseInteger`, the `%`, `@` and `#` operators, and picture strings in `$toMillis`; by design, every real sleep (a Wait state or a Retry backoff) is cut to at most 60 seconds so local runs stay fast, so a Wait of an hour ends after one minute"

- title: "EventBridge + Scheduler"
  cloud: aws
  depth: Deep
  services: [events, scheduler]
  covered: "buses, the full pattern syntax, targets, input transformers, archives and replay, connections and API destinations, schedules (at/rate/cron), Scheduler universal targets (`aws-sdk:<service>:<action>`)"
  not_yet: "EventBridge Pipes; a schedule with no Input delivers `{}` (AWS sends a default notification)"

- title: "Kinesis / Firehose"
  cloud: aws
  depth: Core
  services: [kinesis, firehose]
  covered: "streams, shards, records, iterators, legacy CBOR, consumers with SubscribeToShard event streams (enhanced fan-out); Firehose buffering into S3"
  not_yet: ""

- title: "CloudFormation"
  cloud: aws
  depth: Deep
  services: [cloudformation]
  covered: "stacks, change sets, YAML/JSON, every intrinsic, conditions, rules, SSM parameter types, dynamic references, exports, nested stacks, custom resources, `AWS::Include`, the SAM transform (functions with Api, HttpApi, SQS, SNS, S3, Schedule, DynamoDB, Kinesis and EventBridge events, aliases, Globals, APIs, HTTP APIs, simple tables, layers, state machines), rollback that reverts in-place changes and keeps replaced resources until the update works, about 250 resource types (networking and EC2 instances, volumes and launch templates, ECS, load balancers, Auto Scaling, RDS and DocumentDB/Neptune clusters, ElastiCache, MemoryDB, Redshift, OpenSearch, Route 53, CloudFront, API Gateway, Cognito, AppSync, Glue, Athena, Backup, CodeBuild/CodePipeline/CodeDeploy, IoT, MQ, MSK, EKS and more, each created in its own service), plus any type an embedded service manages through Cloud Control (EFS, WAF, Config and others); a template with any other type is refused with a clear error; `cdk bootstrap`/`deploy`/`destroy` work"
  not_yet: "SAM connectors, applications and deployment preferences, StackSets and macros, drift detection (always in sync), types whose service has no API for them yet (SES receipt rules, RDS proxies, Logs resource policies and destinations, ECR replication, API Gateway accounts and VPC links, Glue workflows, VPN and peering connections)"

- title: "IAM"
  cloud: aws
  depth: Core
  services: [iam]
  covered: "users, groups, roles, managed and inline policies, keys, instance profiles, OIDC/SAML providers, policy simulation, SSH public keys, service last-accessed reports, and **enforcement** (`--iam soft/strict`) of identity policies and permissions boundaries"
  not_yet: "resource-based policies other than S3 bucket policies and API Gateway resource policies, credential reports"

- title: "STS"
  cloud: aws
  depth: Core
  services: [sts]
  covered: "GetCallerIdentity, AssumeRole (multi-account; the role must exist in IAM), web identity (an expired token is refused), session and federation tokens (DurationSeconds 900 or more; with signature checking on, expired credentials are refused)"
  not_yet: "trust policies are not checked, web identity tokens are not verified"

- title: "KMS"
  cloud: aws
  depth: Core
  services: [kms]
  covered: "symmetric, RSA, ECC (incl. secp256k1 and Ed25519), ML-DSA and HMAC keys, aliases, encrypt/decrypt with context, data keys, sign/verify, MAC, rotation"
  not_yet: "grants, imported key material, multi-region keys"

- title: "Secrets Manager"
  cloud: aws
  depth: Core
  services: [secretsmanager]
  covered: "versions and stages, rotation through Lambda, random passwords, batch get"
  not_yet: "replication (metadata only)"

- title: "Systems Manager (SSM)"
  cloud: aws
  depth: Core
  services: [ssm]
  docker: true
  covered: "Parameter Store (String, StringList and SecureString types, paths, history, labels, public AMI parameters, `/aws/reference/secretsmanager/<id>`), documents with versions, permissions and tags, associations, service settings, and Run Command (`SendCommand` runs shell documents with `docker exec` in the containers of running pogi EC2 instances, with statuses and `GetCommandInvocation`)"
  not_yet: "parameter policies; associations run once when made, not on their schedule; Run Command targets InstanceIds only (no tag targets), has one output stream, and runs `aws:runShellScript` steps only; Automation, Session Manager, Inventory and Patch Manager"

- title: "CloudWatch Logs"
  cloud: aws
  depth: Core
  services: [logs]
  covered: "groups, streams, events, filter patterns, subscriptions, metric filters that publish to CloudWatch (a numeric or JSON `$.field` value, `defaultValue`, dimensions, unit; alarms on them fire), retention, Lambda logs, Insights (`fields/filter/sort/limit`)"
  not_yet: "Insights `stats/parse`; metric filters read JSON fields only (not space-delimited `$name`), and `defaultValue` is published per batch of ingested events, not per minute"

- title: "CloudWatch Metrics"
  cloud: aws
  depth: Core
  services: [cloudwatch]
  covered: "metric data, statistics, metric math (basic), alarms with SNS/Lambda actions, CBOR/JSON/Query"
  not_yet: "composite alarm evaluation"

- title: "SES v1 + v2"
  cloud: aws
  depth: Core
  services: [ses]
  covered: "simple, raw and templated email, identities, outbox at `/_aws/ses` and in the console, configuration sets (v1 and v2) with event destinations to SNS, EventBridge (default bus) and CloudWatch (`AWS/SES`) that get Send, Delivery, Bounce and Complaint events, using the mailbox simulator addresses"
  not_yet: "Open, Click and Reject events; Firehose and Pinpoint destinations are stored but get nothing; the sandbox rule that a sender must be verified (any sender is accepted, on purpose)"

- title: "Cognito user pools"
  cloud: aws
  depth: Deep
  services: [cognito-idp]
  covered: "pools, clients, groups, users, sign-up/confirm/forgot flows, USER_PASSWORD, SRP, REFRESH (with token rotation) and CUSTOM auth, choice-based USER_AUTH (password and email/SMS one-time codes), software token MFA with MFA_SETUP and a real TOTP check, identity providers shown on the login page, RS256 JWTs with JWKS and OpenID discovery, OAuth2 endpoints, Lambda triggers, password policy with history, account recovery setting, token validity limits"
  not_yet: "signing in through an external identity provider, passkeys (WEB_AUTHN), hosted-UI sign-up; a user whose MFA method was only switched on has no authenticator, so the code 123456 passes"

- title: "RDS / ElastiCache"
  cloud: aws
  depth: Core
  services: [rds, elasticache]
  docker: true
  covered: "instances, clusters, subnet and parameter groups; real Postgres, MySQL, MariaDB, Redis, Valkey and Memcached containers with Docker"
  not_yet: "snapshot restore, read replicas, parameters applied to engines"

- title: "ECR"
  cloud: aws
  depth: Deep
  services: [ecr]
  docker: true
  covered: "repositories and the image APIs on a real OCI registry: `docker login`/`push`/`pull` at `localhost:4510` (a forwarding container on Docker Desktop, OrbStack and Colima), layer-upload APIs, lifecycle policies, canned scans; `<account>.dkr.ecr.<region>.amazonaws.com/…` images pull from it"
  not_yet: "one registry host for all accounts, blob garbage collection"

- title: "ECS"
  cloud: aws
  depth: Deep
  services: [ecs]
  docker: true
  covered: "clusters, capacity providers, task definitions, tasks as containers (awsvpc via a shared network namespace, secrets from SSM/Secrets Manager, task-role credentials and metadata endpoints, awslogs to CloudWatch Logs, task volumes: host paths, shared Docker volumes and volumesFrom), services that keep their desired count, rolling deployments with `aws.ecs` events on the default bus, the deployment circuit breaker (a deployment whose tasks keep failing to start FAILS, with optional rollback), ALB registration"
  not_yet: "CPU shares, task sets, ECS Exec, EFS and FSx volumes"

- title: "ELB v2"
  cloud: aws
  depth: Deep
  services: [elbv2]
  docker: true
  covered: "ALB/NLB/GWLB control plane; ALBs answer at `http://<dns-name>:7644` (and on their listener port when free) with every rule condition, weighted and sticky forwards, redirects, fixed responses, Lambda targets and health checks; NLBs proxy TCP"
  not_yet: "`authenticate-*` actions, UDP, TLS termination on NLBs"

- title: "EC2 transit gateways, flow logs, hosts and images"
  cloud: aws
  depth: Core
  services: [ec2]
  docker: true
  covered: "transit gateways with VPC and peering attachments (peerings wait for accept) and the default route table links Terraform reads, flow logs with their `LogFormat`, dedicated hosts, EBS encryption by default (applied to new and root volumes), `CreateImage` (a docker commit of the instance container) and `DeregisterImage`, IAM instance profile associations, `AssociateVpcCidrBlock` (extra blocks take subnets), `DescribeInstanceTypeOfferings`"
  not_yet: "flow logs write no records, instances do not run on dedicated hosts, transit gateway route tables and routes, created images keep no snapshots (pogi has no EBS snapshots), IPv6 CIDR blocks on VPCs"

- title: "EKS"
  cloud: aws
  depth: Core
  services: [eks]
  docker: true
  covered: "clusters as k3s containers: `aws eks update-kubeconfig` and `kubectl` work, with EKS-style token authentication and access entries; node groups, Fargate profiles, add-ons and pod identity as metadata"
  not_yet: "node groups add no nodes, version upgrades, a cluster endpoint other machines can reach (it is always `https://127.0.0.1:<port>`; pogi publishes container ports on loopback only)"

- title: "EC2 instances"
  cloud: aws
  depth: Core
  services: [ec2]
  docker: true
  covered: "instances as containers from an AMI catalog, UserData and cloud-config `runcmd`, IMDSv1/v2 with role credentials, reachable at `169.254.169.254` inside instances (an engine that shares the host network keeps only `AWS_EC2_METADATA_SERVICE_ENDPOINT`), ssh into an instance with a key pair (sshd is installed at boot with apk, apt-get, dnf or yum when the image has none), `GetConsoleOutput`, launch templates, security-group ports published, start/stop/terminate"

- title: "Auto Scaling + Application Auto Scaling"
  cloud: aws
  depth: Core
  services: [autoscaling, application-autoscaling]
  docker: true
  covered: "groups that keep their capacity, simple/step/target-tracking policies driven by CloudWatch alarms, scheduled actions, target-group registration; scalable targets for ECS, DynamoDB and Lambda"
  not_yet: "lifecycle hooks pause nothing, cooldowns"

- title: "Batch"
  cloud: aws
  depth: Core
  services: [batch]
  docker: true
  covered: "compute environments, queues, job definitions, jobs as containers with retries, timeouts, arrays and dependencies, logs to CloudWatch"
  not_yet: "multi-node and EKS jobs"

- title: "CodeBuild"
  cloud: aws
  depth: Core
  services: [codebuild]
  docker: true
  covered: "projects and builds that run real buildspecs in containers (phases, env from SSM and Secrets Manager, S3 sources, artifacts to S3, logs to CloudWatch)"
  not_yet: "privileged mode, caches, secondary sources, batch builds"

- title: "RDS extras"
  cloud: aws
  depth: Deep
  services: [rds, rds-data]
  docker: true
  covered: "the Data API (typed parameters, JSON records, batches, real transactions) for Aurora PostgreSQL and MySQL; IAM database authentication through a Postgres/MySQL proxy that checks `generate-db-auth-token` tokens; snapshot copy (also from another region), snapshot modify, and point-in-time restore from dumps; TLS on the IAM proxy for Postgres with a leaf certificate from the local CA; DocumentDB (`mongo:7`), Neptune (Gremlin Server) and SQL Server engines"
  not_yet: "point-in-time restore uses current data, no TLS on MySQL (or on endpoints without IAM auth), MySQL IAM logins run as the master user, Data API arrays that hold NULL come back as text, Neptune openCypher/SPARQL"

- title: "ElastiCache users / MemoryDB"
  cloud: aws
  depth: Core
  services: [elasticache, memorydb]
  docker: true
  covered: "users, user groups and ACLs applied to Redis/Valkey with `ACL SETUSER`; IAM authentication tokens through a RESP proxy; MemoryDB clusters on Valkey"
  not_yet: "MemoryDB IAM sign-in, TLS"

- title: "MSK"
  cloud: aws
  depth: Core
  services: [kafka]
  docker: true
  covered: "provisioned and serverless clusters on Redpanda, bootstrap brokers for host and container clients, configurations and revisions, cluster operations"
  not_yet: "updates change metadata only, TLS/SCRAM/IAM listeners point at the plaintext one"

- title: "Amazon MQ"
  cloud: aws
  depth: Core
  services: [mq]
  docker: true
  covered: "RabbitMQ and ActiveMQ brokers in containers with their users, consoles and endpoints, configurations and revisions, reboots"
  not_yet: "configuration data is not applied, no TLS endpoints"

- title: "OpenSearch Service"
  cloud: aws
  depth: Core
  services: [opensearch]
  docker: true
  covered: "OpenSearch and legacy Elasticsearch domains in containers, reached at `<domain>.<region>.opensearch.localhost:7644` with SigV4 stripped; config, versions, tags"
  not_yet: "upgrades, access policies, multi-node clusters"

- title: "Glue + Athena"
  cloud: aws
  depth: Deep
  services: [glue, athena]
  docker: true
  covered: "Data Catalog databases, tables, partitions, crawlers (CSV/JSON schema inference), the Schema Registry (registries, schemas, versions that ignore custom Avro attributes, version metadata); Athena workgroups, named queries, prepared statements, DDL into Glue, and SELECTs run on DuckDB over the tables' S3 data, with results written to S3"
  not_yet: "data is copied per query, no CTAS/INSERT/views, Parquet crawling"

- title: "Redshift + Data API + Serverless"
  cloud: aws
  depth: Core
  services: [redshift, redshift-data, redshift-serverless]
  docker: true
  covered: "clusters and serverless workgroups on Postgres, the Data API (async statements, typed results, batches, catalog listing) with Redshift DDL clauses rewritten, temporary credentials that really log in; snapshot copy settings, copy grants and snapshot schedules as settings (nothing is copied or taken on a schedule)"
  not_yet: "parameters not applied, snapshots as metadata"

- title: "Timestream for InfluxDB"
  cloud: aws
  depth: Core
  services: [timestream-influxdb]
  docker: true
  covered: "DB instances on InfluxDB 2 with the admin token in Secrets Manager"
  not_yet: ""

- title: "AppSync"
  cloud: aws
  depth: Deep
  services: [appsync]
  covered: "GraphQL APIs with API key, Cognito, IAM, OIDC and Lambda auth; Lambda, DynamoDB, HTTP, NONE and RDS data sources; VTL and APPSYNC_JS resolvers, pipelines; subscriptions over the real-time WebSocket protocol with argument filters; introspection"
  not_yet: "sibling fields resolve serially, no caching, enhanced filters"

- title: "EventBridge Pipes"
  cloud: aws
  depth: Deep
  services: [pipes]
  covered: "SQS, Kinesis and DynamoDB Streams sources with filters, Lambda/Step Functions/API destination enrichment, every async target, input templates, retries of failed batches"
  not_yet: "stream DLQs and partial batch failures, `HttpParameters`"

- title: "API Gateway WebSockets"
  cloud: aws
  depth: Core
  services: [apigateway]
  covered: "WEBSOCKET APIs with route selection, `$connect` authorizers, two-way routes, `@connections` POST/GET/DELETE, integration and route responses"
  not_yet: "integration responses shape MOCK only"

- title: "Cognito identity pools"
  cloud: aws
  depth: Core
  services: [cognito-identity]
  covered: "GetId, credentials for authenticated (user pools, OIDC, developer) and unauthenticated identities, role mappings, GetOpenIdToken"
  not_yet: "SAML and social tokens trusted unverified"

- title: "IoT Core"
  cloud: aws
  depth: Core
  services: [iot, iotdata]
  covered: "things, groups, certificates, policies; an MQTT broker (TCP 1883 and WebSocket `/mqtt`), device shadows (classic and named), rules (SQL subset) to SQS, SNS, Lambda, DynamoDB, Kinesis, S3 and republish; the iotdata API"
  not_yet: "TLS client certificates, other rule actions"

- title: "Cloud Map"
  cloud: aws
  depth: Core
  services: [servicediscovery]
  covered: "namespaces (private DNS ones create Route 53 zones with A/SRV records), services, instances, `DiscoverInstances` with filters, custom health; ECS service registries"
  not_yet: "Route 53 health checks"

- title: "CloudTrail"
  cloud: aws
  depth: Core
  services: [cloudtrail]
  covered: "LookupEvents over every API call pogi serves, trails delivering gzipped logs to S3 and CloudWatch Logs, event selectors"
  not_yet: "events kept in memory only"

- title: "Fault Injection Service"
  cloud: aws
  depth: Core
  services: [fis]
  covered: "templates and experiments injecting throttling, errors and latency per service, operation, role or Lambda function; stop conditions on CloudWatch alarms"
  not_yet: "target filters"

- title: "CodeDeploy + CodePipeline"
  cloud: aws
  depth: Core
  services: [codedeploy, codepipeline]
  covered: "Lambda deployments with linear/canary traffic shifting, hooks and rollback; pipelines with S3 sources (a source with `PollForSourceChanges` set to `true` starts a run when the object changes), CodeBuild, CloudFormation, Lambda and approvals"
  not_yet: "change-set modes, ECS blue/green"

- title: "Organizations + SCPs, Verified Permissions, Resource Explorer"
  cloud: aws
  depth: Core
  services: [organizations, verifiedpermissions, resource-explorer-2]
  covered: "organizations, OUs, accounts, policies and their attachment; Cedar policy stores, schemas, templates and IsAuthorized (with Cognito tokens); indexes, views and search"
  not_yet: "SCPs don't restrict root; list operations return one page"

- title: "AppConfig"
  cloud: aws
  depth: Core
  services: [appconfig]
  covered: "applications, environments, profiles, hosted versions with JSON Schema validators, deployments and strategies, the data plane (`StartConfigurationSession` and `GetLatestConfiguration`, as Ion text when `Accept` asks for it), feature flags, extensions"
  not_yet: "growth is not simulated"

- title: "CloudFront"
  cloud: aws
  depth: Core
  services: [cloudfront]
  covered: "distributions served at `<id>.cloudfront.localhost` with behaviors, S3 and custom origins, cache and origin-request policies, functions (cloudfront-js), invalidations, OAC"
  not_yet: "signed URLs, viewer protocol policy"

- title: "S3 Vectors"
