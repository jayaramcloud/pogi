{{define "xcss"}}<style>
.x label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
.x .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 10px; }
.x .row > label { flex: 1; min-width: 160px; }
.x .row > label.wide { flex: 3; min-width: 280px; }
.x select, .x input, .x textarea { color: var(--text); }
.x .note { color: var(--dim); font-size: 12.5px; margin: 6px 0; }
.x .hidden-secret { letter-spacing: .2em; color: var(--dim); }
.x iframe.mail { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.x svg.graph text { font: 12px system-ui, sans-serif; fill: var(--text); }
.x svg.graph .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.x svg.graph .node.succeeded rect { fill: var(--ok-bg); stroke: var(--ok); }
.x svg.graph .node.failed rect { fill: var(--bad-bg); stroke: var(--bad); }
.x svg.graph .node.running rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 3; }
.x svg.graph .edge { fill: none; stroke: var(--dim); stroke-width: 1.4; }
.x svg.graph .edge.catch { stroke-dasharray: 4 3; }
.x svg.graph .type { fill: var(--dim); font-size: 10px; }
.x ul.tree { list-style: none; padding-left: 18px; margin: 2px 0; border-left: 1px solid var(--line); }
.x ul.tree.top { border: 0; padding: 0; }
.x .state { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; background: var(--code); }
.x .state.running { background: var(--ok-bg); color: var(--ok); }
.x .state.stopped, .x .state.terminated, .x .state.shutting-down { background: var(--bad-bg); color: var(--bad); }
.x .state.pending, .x .state.stopping { background: var(--warn-bg); color: var(--warn); }
</style>{{end}}
{{define "xresult"}}{{with .}}
{{if .Note}}<p class="note">{{.Note}}</p>{{end}}
{{if .Cols}}<div style="overflow:auto"><table><thead><tr>{{range .Cols}}<th>{{.}}</th>{{end}}</tr></thead><tbody>
{{range .Rows}}<tr>{{range .}}<td class="mono body">{{.}}</td>{{end}}</tr>{{end}}</tbody></table></div>
{{else if not .Note}}<p class="empty">No rows.</p>{{end}}
{{if .Raw}}<details><summary class="dim">JSON</summary><pre>{{.Raw}}</pre></details>{{end}}
{{end}}{{end}}
