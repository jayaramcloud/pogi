# Trivy secret rules. These allow only known false positives, by path and pattern.
allow-rules:
  # The documented example key for the local dev user (secret "devsecret"). It is not a real credential.
  - id: example-access-key
    description: documented example access key ending in 0001
    regex: AKIADEV0000000000001
    path: ^(cmd/pogi/config\.go|README\.md|docs/how-to/switch-iam-modes\.md|docs/reference/configuration\.md)$
  # This file writes a service account key that pogi generates at runtime. No key is stored in the code.
  - id: runtime-generated-gcp-key
    description: service account key built at runtime
    path: ^internal/gcp/iam/iam\.go$
